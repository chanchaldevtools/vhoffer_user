apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

react {
    autolinkLibrariesWithApp()
}

// Proguard ko true karna recommended hai production ke liye
def enableProguardInReleaseBuilds = true 
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'


android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.chauffer"
    defaultConfig {
        applicationId "com.chauffer"
        multiDexEnabled true
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        vectorDrawables.useSupportLibrary = true
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }
    
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file('my-upload-key.keystore')
            storePassword 'password' // 📝 Apne real password se replace karein
            keyAlias 'my-key-alias'  // 📝 Apne real alias se replace karein
            keyPassword 'password'
        }
    }
    
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
        release {
            signingConfig signingConfigs.release
            
            // 🔥 CRASH FIX: Isko dynamic true kiya gaya hai taaki rules properly apply ho sakein
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            
            debuggable false // Release mode secure hai
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    
    // Updated keyword from packagingOptions to packaging
    packaging {
        pickFirst "**/*.so"
        pickFirst "**/libreact_nativemodule_core.so"
        pickFirst "**/libjsi.so"
        pickFirst "**/libreactnative.so"
        pickFirst "**/libjsc.so"
        pickFirst "**/libhermes.so"
        pickFirst "**/libc++_shared.so"
        pickFirst "**/libfbjni.so"
          pickFirst "**/libappmodules.so"
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.facebook.fresco:fresco:3.1.3'
    implementation 'com.facebook.fresco:animated-gif:3.1.3'
    
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
